name: Record demo video

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyautogui pywinauto imageio-ffmpeg

      - name: Record
        run: python demo/record_demo.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-recording
          path: demo_out/*
          if-no-files-found: ignore
